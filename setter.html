<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <link rel="icon" href="data:,">
  <title>旋转之后 · 出题端</title>
  <link rel="stylesheet" href="shared/common.css?v=6">
</head>
<body data-app="setter">
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <h1>旋转之后</h1>
        <span class="mode-badge">出题端</span>
      </div>
      <div class="header-status" id="headerStatus">10×10 · 下边第 6 格 · 5 颗球</div>
    </header>

    <main class="workspace">
      <section class="board-column" aria-label="题面棋盘">
        <div class="board-frame">
          <div id="mazeBoard" class="maze-stage"></div>
          <div class="board-caption">
            <div class="legend">
              <span class="legend-item"><i class="legend-swatch fixed"></i>题面固定板</span>
            </div>
            <strong>额外初始板：<span id="initialWallCount">0</span> 块</strong>
          </div>
        </div>
      </section>

      <aside class="side-column" aria-label="出题控制台">
        <section class="tool-section">
          <p class="section-kicker">QUESTION</p>
          <h2>题目设置</h2>
          <label class="field grow">
            <span>题目名称</span>
            <input id="questionNameInput" maxlength="40" value="未命名题目" autocomplete="off">
          </label>
          <div class="control-row">
            <label class="field">
              <span>球的数量</span>
              <select id="ballCountSelect" aria-label="球的数量"></select>
            </label>
            <span class="section-copy">固定按红、黄、蓝、绿、紫、橙的顺序取前 N 颗</span>
          </div>
          <div class="control-row">
            <label class="field">
              <span>出口边</span>
              <select id="exitSideSelect" aria-label="出口边"></select>
            </label>
            <label class="field">
              <span>出口位置</span>
              <select id="exitIndexSelect" aria-label="出口位置"></select>
            </label>
          </div>
          <div class="control-row">
            <button id="randomBallsBtn">随机球位</button>
            <button id="randomInstructionsBtn">随机旋转</button>
            <button id="randomQuestionBtn">随机整题</button>
          </div>
        </section>

        <section class="tool-section">
          <p class="section-kicker">SEQUENCE</p>
          <h2>旋转步骤</h2>
          <div class="control-row">
            <label class="field">
              <span>旋转次数</span>
              <select id="rotationCountSelect" aria-label="旋转次数"></select>
            </label>
            <span class="section-copy">↻ 顺时针 · ↺ 逆时针</span>
          </div>
          <div class="instruction-grid" id="instructionGrid"></div>
        </section>

        <section class="tool-section">
          <p class="section-kicker">INITIAL BOARD</p>
          <h2>初始板块</h2>
          <div class="control-row">
            <button id="clearInitialWallsBtn">清空额外初始板</button>
            <button id="resetQuestionBtn">恢复默认题面</button>
          </div>
          <div class="result-box" id="setterResult" role="status">题面已就绪。</div>
        </section>

        <section class="tool-section">
          <p class="section-kicker">TARGET</p>
          <h2>固定出球顺序</h2>
          <div class="target-order" id="targetOrder"></div>
        </section>

        <section class="tool-section">
          <p class="section-kicker">SOLUTION</p>
          <h2>生成答案</h2>
          <div class="control-row">
            <button class="primary" id="generateSolutionsBtn">生成 3 个答案</button>
            <button id="improveBestSolutionBtn" disabled>寻找更优解</button>
            <button id="deployBestSolutionBtn" disabled>部署最优解</button>
            <button id="returnQuestionBtn" disabled>返回题面</button>
          </div>
          <div class="solution-list" id="solutionList"></div>
          <div class="solution-library-heading">
            <strong>已保存优秀答案</strong>
            <span><span id="savedSolutionCount">0</span> 个</span>
          </div>
          <div class="solution-list saved-solution-list" id="savedSolutionList"></div>
          <div class="control-row solution-verify-controls">
            <button id="stepVerifySolutionBtn" disabled>逐步验证</button>
            <button id="continuousVerifySolutionBtn" disabled>连续验证</button>
            <button id="resetSolutionVerifyBtn" disabled>重置验证</button>
          </div>
          <div class="metric-row solution-metrics" aria-label="答案验证状态">
            <div class="metric"><span>当前步骤</span><strong id="solutionStepDisplay">0 / 20</strong></div>
            <div class="metric"><span>已出球</span><strong id="solutionReleasedCount">0 / 5</strong></div>
            <div class="metric"><span>答案板数</span><strong id="solutionWallCount">0</strong></div>
          </div>
          <div class="result-box" id="solutionResult" role="status">尚未生成答案。</div>
        </section>

        <section class="tool-section">
          <p class="section-kicker">QUESTION FILE</p>
          <h2>题目文件</h2>
          <div class="control-row">
            <button class="primary" id="saveQuestionBtn">保存题目</button>
            <button id="loadQuestionBtn">读取题目</button>
            <input class="visually-hidden" id="questionFileInput" type="file" accept="application/json,.json">
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="shared/question-format.js?v=7"></script>
  <script src="shared/maze-core.js?v=7"></script>
  <script src="shared/solution-generator.js?v=7"></script>
  <script src="shared/board-ui.js?v=7"></script>
  <script src="setter.js?v=7"></script>
</body>
</html>
